name: Hoteldaten aktualisieren

# Holt die Hotels für den Hotel-Konfigurator von der Xotelo-API und speichert sie
# unter data/hotel-offers/. Läuft täglich, nach Änderungen am Reiseplan und auf Knopfdruck
# (Actions → Hoteldaten aktualisieren → Run workflow).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      stations:
        description: "Nur diese Stationen (z. B. seoul busan), leer = alle"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - js/data.js
      - scripts/fetch-hotels.mjs
      - .github/workflows/hotel-offers.yml

permissions:
  contents: write

concurrency:
  group: hotel-offers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hoteldaten holen
        run: node scripts/fetch-hotels.mjs ${{ github.event.inputs.stations }}
      - name: Speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotel-offers
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Hoteldaten aktualisiert"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
