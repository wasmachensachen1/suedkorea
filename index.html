<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Südkorea-Rundreise 2027</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/gate.js"></script>
</head>
<body>
  <form class="gate" id="gate" autocomplete="off">
    <span class="brand-mark">한</span>
    <h1>Südkorea 2027</h1>
    <p>Bitte Passwort eingeben.</p>
    <label for="gatePw" class="sr-only">Passwort</label>
    <input type="password" id="gatePw" placeholder="Passwort" required>
    <label class="gate-remember"><input type="checkbox" id="gateRemember" checked> Auf diesem Gerät merken</label>
    <button type="submit">Öffnen</button>
    <p class="gate-error" id="gateError" role="alert" hidden>Das Passwort stimmt nicht.</p>
  </form>

  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Menü öffnen">☰</button>
    <a href="#uebersicht" class="brand">
      <span class="brand-mark">한</span>
      <span>
        <strong>Südkorea 2027</strong>
        <small>15.9. – 6.10.</small>
      </span>
    </a>
    <div class="countdown" id="countdown"></div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Hauptnavigation"></nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
