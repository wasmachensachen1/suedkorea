<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf7f2">
  <title>Südkorea-Rundreise 2027</title>
  <link rel="stylesheet" href="css/style.css?v=20261119-4">
  <link rel="stylesheet" href="css/vice.css?v=20261119-4">
  <script src="js/theme.js?v=20261119-4"></script>
  <script src="js/gate.js?v=20261119-4"></script>
</head>
<body>
  <form class="gate" id="gate" autocomplete="off">
    <button type="button" class="theme-toggle gate-toggle" data-theme-toggle aria-pressed="false">🌴 Mense-Modus</button>
    <div class="gate-art" data-vice-art="overview" aria-hidden="true"></div>
    <span class="brand-mark">한</span>
    <h1>Südkorea 2027</h1>
    <p data-kp="Gebb emol des Passwort ei.">Bitte Passwort eingeben.</p>
    <label for="gatePw" class="sr-only">Passwort</label>
    <input type="password" id="gatePw" placeholder="Passwort" required>
    <label class="gate-remember"><input type="checkbox" id="gateRemember" checked> <span data-kp="Uff dem Gerät merke">Auf diesem Gerät merken</span></label>
    <button type="submit" data-kp="Uffmache">Öffnen</button>
    <p class="gate-error" id="gateError" role="alert" hidden data-kp="Nee, des Passwort stimmt net.">Das Passwort stimmt nicht.</p>
  </form>

  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Menü öffnen">☰</button>
    <a href="#uebersicht" class="brand">
      <span class="brand-mark">한</span>
      <span>
        <strong>Südkorea 2027</strong>
        <small>15.9. – 6.10.</small>
      </span>
    </a>
    <div class="countdown" id="countdown"></div>
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">🌴 Mense-Modus</button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Hauptnavigation"></nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <script src="js/data.js?v=20261119-4"></script>
  <script src="js/data.kurpfalz.js?v=20261119-4"></script>
  <script src="js/vice-art.js?v=20261119-4"></script>
  <script src="js/github.js?v=20261119-4"></script>
  <script src="js/todos.js?v=20261119-4"></script>
  <script src="js/hotels.js?v=20261119-4"></script>
  <script src="js/app.js?v=20261119-4"></script>
</body>
</html>
